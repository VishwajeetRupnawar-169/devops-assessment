
name: Agentic Workflow

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  analyze:
    name: AI Agent - Analyze & Plan
    runs-on: ubuntu-latest

    outputs:
      build: ${{ steps.agent.outputs.build }}
      test: ${{ steps.agent.outputs.test }}
      deploy: ${{ steps.agent.outputs.deploy }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Analyze repository
        id: agent
        env:
          HF_TOKEN: ${{ secrets.HF_API_KEY }}
        run: |

          echo "================================"
          echo "AI AGENT - ANALYSIS"
          echo "================================"

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            FILES=$(git diff --name-only HEAD^ HEAD)
          else
            FILES=$(git ls-tree -r --name-only HEAD)
          fi

          echo "Changed files:"
          echo "$FILES"

          PROMPT="You are a DevOps planning agent.

          Analyze these changed files:

          $FILES

          Decide which CI/CD actions are required.

          Return ONLY valid JSON.
          Do not use markdown.
          Do not explain anything.

          Required format:
          {
            \"build\": true,
            \"test\": true,
            \"deploy\": false
          }"

          RESPONSE=$(curl -s \
            -X POST \
            "https://router.huggingface.co/v1/chat/completions" \
            -H "Authorization: Bearer $HF_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg prompt "$PROMPT" \
              '{
                model: "meta-llama/Meta-Llama-3.1-8B-Instruct",
                messages: [
                  {
                    role: "user",
                    content: $prompt
                  }
                ],
                max_tokens: 100
              }')")

          echo "AI response:"
          echo "$RESPONSE"

          CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')

          echo "Agent decision:"
          echo "$CONTENT"

          # Extract JSON from the model response
          DECISION=$(echo "$CONTENT" | sed -n '/{/,/}/p' | tr -d '\n')

          echo "Parsed decision:"
          echo "$DECISION"

          BUILD=$(echo "$DECISION" | jq -r '.build // true')
          TEST=$(echo "$DECISION" | jq -r '.test // true')
          DEPLOY=$(echo "$DECISION" | jq -r '.deploy // false')

          echo "Build: $BUILD"
          echo "Test: $TEST"
          echo "Deploy: $DEPLOY"

          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "test=$TEST" >> "$GITHUB_OUTPUT"
          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"


  build:
    name: Build
    needs: analyze
    if: needs.analyze.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Build application
        run: |
          echo "================================"
          echo "BUILD"
          echo "================================"
          echo "Agent decided that a build is required."
          echo "Building application..."
          echo "Build successful!"


  test:
    name: Test
    needs:
      - analyze
      - build
    if: needs.analyze.outputs.test == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Run tests
        run: |
          echo "================================"
          echo "TEST"
          echo "================================"
          echo "Agent decided that tests are required."
          echo "Running tests..."
          echo "All tests passed!"


  deploy:
    name: Deploy
    needs:
      - analyze
      - test
    if: needs.analyze.outputs.deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application
        run: |
          echo "================================"
          echo "DEPLOY"
          echo "================================"
          echo "Agent decided that deployment is required."
          echo "Deploying application..."
          echo "Deployment successful!"


  report:
    name: Agent Report
    needs:
      - analyze
      - build
      - test
      - deploy
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate report
        run: |
          echo "================================"
          echo "AGENTIC WORKFLOW REPORT"
          echo "================================"
          echo ""
          echo "AI Agent Decision:"
          echo "Build:  ${{ needs.analyze.outputs.build }}"
          echo "Test:   ${{ needs.analyze.outputs.test }}"
          echo "Deploy: ${{ needs.analyze.outputs.deploy }}"
          echo ""
          echo "Build result:  ${{ needs.build.result }}"
          echo "Test result:   ${{ needs.test.result }}"
          echo "Deploy result: ${{ needs.deploy.result }}"
          echo ""
          echo "Agentic workflow completed."
